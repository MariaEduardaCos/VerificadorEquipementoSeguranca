# Limitacao de memoria da JVM para maquina com 4GB RAM
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Desativa compilacao paralela para evitar picos simultaneos de memoria e CPU
org.gradle.parallel=false

# Limita o daemon do compilador Kotlin para nao consumir memoria excessiva
kotlin.daemon.jvm.options=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# Reutiliza compilações anteriores através do cache
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

